name: Desktop release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v1.0.3
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      created: ${{ steps.meta.outputs.created }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve tag and ensure release exists
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Lime AI ${TAG#v}" \
              --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    needs: prepare
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Build NSIS + portable
        run: npm run dist:win -- --publish never

      - name: List Windows artifacts
        run: dir release

      - name: Upload Windows assets to release
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release/*.exe --clobber --repo "${{ github.repository }}"

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 30
    needs: prepare
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Build universal DMG + ZIP
        run: npm run dist:mac -- --publish never --universal

      - name: List macOS artifacts
        run: ls -lh release

      - name: Upload macOS assets to release
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release/*.dmg release/*.zip --clobber --repo "${{ github.repository }}"

  checksums:
    name: Refresh SHA-256 checksums
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, windows, macos]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download current release assets
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "$REPO" --dir release-assets --clobber
          rm -f release-assets/SHA256SUMS
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "Expected 5 build assets, found $count"
            find release-assets -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

      - name: Regenerate SHA256SUMS from published assets
        run: |
          cd release-assets
          sha256sum * | sort -k2 > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

      - name: Upload refreshed checksum file
        run: gh release upload "$TAG" SHA256SUMS --clobber --repo "$REPO"

      - name: Update README checksum block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          marker = '### Checksums SHA-256'
          start = text.index('```text\n', text.index(marker)) + len('```text\n')
          end = text.index('\n```', start)
          sums = Path('SHA256SUMS').read_text().rstrip()
          path.write_text(text[:start] + sums + text[end:])
          PY

      - name: Update release notes
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body' > release-body.md
          python3 - <<'PY'
          import os
          from pathlib import Path

          body = Path('release-body.md').read_text().rstrip()
          marker = '\n## SHA-256'
          if marker in body:
              body = body.split(marker, 1)[0].rstrip()
          sums = Path('SHA256SUMS').read_text().rstrip()
          repo = os.environ['REPO']
          tag = os.environ['TAG']
          extra = (
              '\n\n## SHA-256\n\n'
              f'The complete list is also attached as [SHA256SUMS](https://github.com/{repo}/releases/download/{tag}/SHA256SUMS).\n\n'
              f'```text\n{sums}\n```\n'
          )
          Path('release-body.md').write_text(body + extra)
          PY
          gh release edit "$TAG" --repo "$REPO" --notes-file release-body.md
          rm -f release-body.md

      - name: Commit refreshed checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add SHA256SUMS README.md
          if git diff --cached --quiet; then
            echo "Checksums are already up to date."
          else
            git commit -m "Refresh SHA-256 checksums"
            git push origin HEAD:main
          fi

  verify:
    name: Verify SHA-256 assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, checksums]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release assets
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --dir release-assets --clobber

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

  publish:
    name: Publish release
    if: needs.prepare.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, verify]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish draft release
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --draft=false
