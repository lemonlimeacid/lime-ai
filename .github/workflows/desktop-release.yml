name: Desktop release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v1.0.3

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Build NSIS + portable
        run: npm run dist:win -- --publish never

      - name: List Windows artifacts
        run: dir release

      - name: Upload Windows assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/*.exe
          fail_on_unmatched_files: true

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run icons

      - name: Build universal DMG + ZIP
        run: npm run dist:mac -- --publish never --universal

      - name: List macOS artifacts
        run: ls -lh release

      - name: Upload macOS assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true

  verify:
    name: Verify SHA-256 assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [windows, macos]
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --dir release-assets --clobber

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS
